- id: conj-anderson-lean/closure-formula
  decl: AndersonAudit.closure_formula
  kind: theorem
  summary: 'Closing ports C of a finite scattering system: if L and L_w are invertible, 1 - zB is invertible and the reduced scattering matrix is A + z T (1 - zB)^-1 T^T with z = (w+i)/(w-i).'
