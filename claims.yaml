- id: conj-anderson-lean/contraction-identity
  decl: AndersonAudit.contraction_identity
  kind: theorem
  summary: With K = Y^T G Y and W = -Im L for any invertible L, Im K - K* K = Y^T G* (W - Y Y^T) G Y.
  aliases: []
  keywords:
  - anderson-model
  - finite-algebraic-core
  - ward-identity
  - contraction
  file: AndersonAudit/FiniteCore.lean
