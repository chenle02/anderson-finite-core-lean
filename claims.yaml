- id: conj-anderson-lean/scattering-unitary
  decl: AndersonAudit.scattering_unitary
  kind: theorem
  summary: 'The scattering matrix S = 1 + 2i Y^T G Y of the finite physical system is unitary: S* S = 1 and S S* = 1.'
  aliases: []
  keywords:
  - anderson-model
  - finite-algebraic-core
