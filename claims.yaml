  depends_on: []
- id: conj-anderson-lean/contraction-ineq
  decl: AndersonAudit.contraction_ineq
  kind: theorem
  summary: If W = -Im L dominates Y Y^T, the port response K = Y^T G Y satisfies |K a|^2 <= Im(a* K a) for every vector a.
  aliases: []
  keywords:
