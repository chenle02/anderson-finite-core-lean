# claims/1 for conj-anderson-lean (read by `lean-pkg claims sync`; see lean-pkg docs/lifecycle.md).
# Scope: only the finite-dimensional algebraic core of P2 is formalized; none of these claims is the
# paper's localization theorem (README.md, docs/scope.md). `reusable`: the paper-labelled results;
# `internal`: steps toward them. Every decl is in comparator/config-finite-core.json.
schema: claims/1
package: conj-anderson-lean
claims:
- id: conj-anderson-lean/ward-general
  decl: AndersonAudit.ward_general
  kind: theorem
  summary: For an invertible finite complex matrix L with G = L^-1 and W = -Im L, Im G = G* W G = G W G* (the Ward identity, no other hypothesis on L).
  aliases: []
  keywords:
  - anderson-model
  - finite-algebraic-core
  - ward-identity
  - resolvent
  - scattering-matrix
  file: AndersonAudit/FiniteCore.lean
  status: reusable
  superseded_by: null
  citation: P2 (openai/math family 261 at adc7f124), mat:ward-identity, sections/matrix.tex:48-53
  depends_on: []
- id: conj-anderson-lean/ward-physical
  decl: AndersonAudit.ward_physical
  kind: theorem
  summary: 'The Ward identity in the physical case W = Y Y^T: G - G* = 2i G* (Y Y^T) G = 2i G (Y Y^T) G*.'
  aliases: []
  keywords:
  - anderson-model
  - finite-algebraic-core
  - ward-identity
  file: AndersonAudit/FiniteCore.lean
  status: internal
  superseded_by: null
