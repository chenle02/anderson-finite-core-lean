- id: conj-anderson-lean/scattering-blocks
  decl: AndersonAudit.scattering_blocks
  kind: theorem
  summary: For ports split as Y = [Y_R | Y_C], the lower-left block of the scattering matrix is 2i Y_C^T G Y_R, with no symmetry assumed.
