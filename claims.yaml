- id: conj-anderson-lean/energy-closure-general
  decl: AndersonAudit.energy_closure_general
  kind: theorem
  summary: For any A, u, w, gamma and real diagonal F, the trace energy satisfies Q(A + gamma u w^T) - Q(A) = -2 Re(gamma w^T F A* F u) - |gamma|^2 (u* F u)(w^T F conj w).
