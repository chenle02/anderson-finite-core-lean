  depends_on: []
- id: conj-anderson-lean/scattering-symm
  decl: AndersonAudit.scattering_symm
  kind: theorem
  summary: For a real symmetric site Hamiltonian and real port matrix Y, the scattering matrix S = 1 + 2i Y^T G Y of the finite system is symmetric.
  aliases: []
  keywords:
  - anderson-model
  - finite-algebraic-core
  - scattering-matrix
  - time-reversal
  file: AndersonAudit/FiniteCore.lean
